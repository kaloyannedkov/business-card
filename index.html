<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калоян Недков — Partners Group</title>
<style>
  :root{
    --red: #C6102D;
    --red-deep: #8C0B20;
    --ink: #1B1B1B;
    --paper: #FFFFFF;
    --mist: #F6F4F3;
    --line: #E7E2E1;
    --muted: #7A7473;
  }

  *{ box-sizing:border-box; }

  @font-face{
    font-family:'system-serif';
    src:local('Georgia');
  }

  html,body{
    margin:0; padding:0;
    background:var(--mist);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:22px;
    overflow:hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 24px 48px -12px rgba(140,11,32,0.18);
    position:relative;
  }

  .band{
    background: linear-gradient(155deg, var(--red) 0%, var(--red-deep) 100%);
    padding: 34px 28px 46px;
    position:relative;
    color:#fff;
    overflow:hidden;
  }

  .band::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:50%;
  }
  .band::before{
    content:"";
    position:absolute;
    right:-10px; bottom:-70px;
    width:120px; height:120px;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:50%;
  }

  .wordmark{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    opacity:.85;
    font-weight:600;
    margin-bottom:22px;
  }

  .avatar{
    width:64px; height:64px;
    border-radius:50%;
    background:#fff;
    color:var(--red-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: system-serif, Georgia, serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:.02em;
    margin-bottom:16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }

  .name{
    font-family: system-serif, Georgia, serif;
    font-size:26px;
    line-height:1.2;
    font-weight:700;
    margin:0 0 4px;
  }

  .role{
    font-size:14.5px;
    font-weight:500;
    opacity:.92;
  }

  .body{
    padding: 22px 24px 26px;
  }

  .save-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px 16px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
    margin-bottom:22px;
  }
  .save-btn:hover{ background:#000; }
  .save-btn:active{ transform: scale(0.98); }
  .save-btn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

  .eyebrow{
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin: 0 0 10px 2px;
  }

  .rows{
    border-top:1px solid var(--line);
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 2px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
  }

  .row:focus-visible{ outline:2px solid var(--red); outline-offset:2px; border-radius:8px; }

  .icon{
    flex:none;
    width:36px; height:36px;
    border-radius:10px;
    background:var(--mist);
    display:flex; align-items:center; justify-content:center;
    color:var(--red);
  }
  .icon svg{ width:17px; height:17px; }

  .row-text{ min-width:0; }
  .row-label{
    font-size:10.5px;
    color:var(--muted);
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:1px;
  }
  .row-value{
    font-size:14.5px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .foot{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:20px;
    letter-spacing:.02em;
  }

  .toast{
    position:fixed;
    left:50%; bottom:28px;
    transform: translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .save-btn, .toast{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="band">
      <div class="wordmark">Partners Group</div>
      <div class="avatar">КН</div>
      <div class="name">Калоян Недков</div>
      <div class="role">Financial Consultant</div>
    </div>

    <div class="body">
      <button class="save-btn" id="saveBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Запази контакт
      </button>

      <div class="eyebrow">Контакти</div>
      <div class="rows">
        <a class="row" href="tel:+359882867065">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21 3 13.2 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
          <span class="row-text">
            <div class="row-label">Телефон</div>
            <div class="row-value">+359 88 286 7065</div>
          </span>
        </a>

        <a class="row" href="mailto:kaloyan.nedkov@pgbg.bg">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18v12H3V6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
          <span class="row-text">
            <div class="row-label">Имейл</div>
            <div class="row-value">kaloyan.nedkov@pgbg.bg</div>
          </span>
        </a>

        <a class="row" href="https://www.partnersgroup.bg/" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18" stroke="currentColor" stroke-width="1.6"/></svg></span>
          <span class="row-text">
            <div class="row-label">Уебсайт</div>
            <div class="row-value">partnersgroup.bg</div>
          </span>
        </a>

        <a class="row" href="https://www.linkedin.com/in/kaloyan-nedkov-7628962ab" target="_blank" rel="noopener" style="border-bottom:none;">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 10v6.2M7.5 7.3v.1M11.5 16.2V10M11.5 12.6c0-1.5 1.2-2.6 2.6-2.6 1.4 0 2.4.9 2.4 2.6v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="row-text">
            <div class="row-label">LinkedIn</div>
            <div class="row-value">kaloyan-nedkov</div>
          </span>
        </a>
      </div>

      <div class="foot">Partners Group BG &middot; финансов консултант</div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Визитката е запазена</div>

<script>
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Недков;Калоян;;;",
    "FN:Калоян Недков",
    "ORG:Partners Group",
    "TITLE:Financial Consultant",
    "TEL;TYPE=CELL,VOICE:+359882867065",
    "EMAIL;TYPE=INTERNET,WORK:kaloyan.nedkov@pgbg.bg",
    "URL:https://www.partnersgroup.bg/",
    "item1.URL:https://www.linkedin.com/in/kaloyan-nedkov-7628962ab",
    "item1.X-ABLabel:LinkedIn",
    "END:VCARD"
  ].join("\r\n");

  document.getElementById('saveBtn').addEventListener('click', () => {
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Kaloyan_Nedkov.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  });
</script>

</body>
</html>
