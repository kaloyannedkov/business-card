<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калоян Недков — Partners Group</title>
<style>
  :root{
    --red: #C6102D;
    --red-deep: #8C0B20;
    --ink: #1B1B1B;
    --paper: #FFFFFF;
    --mist: #F6F4F3;
    --line: #E7E2E1;
    --muted: #7A7473;
  }

  *{ box-sizing:border-box; }

  @font-face{
    font-family:'system-serif';
    src:local('Georgia');
  }

  html,body{
    margin:0; padding:0;
    background:var(--mist);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:22px;
    overflow:hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 24px 48px -12px rgba(140,11,32,0.18);
    position:relative;
  }

  .band{
    background: linear-gradient(155deg, var(--red) 0%, var(--red-deep) 100%);
    padding: 34px 28px 46px;
    position:relative;
    color:#fff;
    overflow:hidden;
  }

  .band::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:50%;
  }
  .band::before{
    content:"";
    position:absolute;
    right:-10px; bottom:-70px;
    width:120px; height:120px;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:50%;
  }

  .wordmark{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    opacity:.85;
    font-weight:600;
    margin-bottom:22px;
  }

  .avatar{
    width:72px; height:72px;
    border-radius:50%;
    background:#fff;
    color:var(--red-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: system-serif, Georgia, serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:.02em;
    margin-bottom:16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    overflow:hidden;
    border: 2.5px solid rgba(255,255,255,0.85);
  }
  .avatar img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .name{
    font-family: system-serif, Georgia, serif;
    font-size:26px;
    line-height:1.2;
    font-weight:700;
    margin:0 0 4px;
  }

  .role{
    font-size:14.5px;
    font-weight:500;
    opacity:.92;
  }

  .body{
    padding: 22px 24px 26px;
  }

  .save-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px 16px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
    margin-bottom:22px;
  }
  .save-btn:hover{ background:#000; }
  .save-btn:active{ transform: scale(0.98); }
  .save-btn:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }

  .eyebrow{
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin: 0 0 10px 2px;
  }

  .rows{
    border-top:1px solid var(--line);
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 2px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
  }

  .row:focus-visible{ outline:2px solid var(--red); outline-offset:2px; border-radius:8px; }

  .icon{
    flex:none;
    width:36px; height:36px;
    border-radius:10px;
    background:var(--mist);
    display:flex; align-items:center; justify-content:center;
    color:var(--red);
  }
  .icon svg{ width:17px; height:17px; }

  .row-text{ min-width:0; }
  .row-label{
    font-size:10.5px;
    color:var(--muted);
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:1px;
  }
  .row-value{
    font-size:14.5px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .foot{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin-top:20px;
    letter-spacing:.02em;
  }

  .toast{
    position:fixed;
    left:50%; bottom:28px;
    transform: translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .save-btn, .toast{ transition:none; }
  }
</style>
</head>

    a.download = 'Kaloyan_Nedkov.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  });
</script>
